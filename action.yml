name: 'GitHub Profile Cards'
description: 'Generate GitHub profile summary cards with modern design'
author: 'xeikit'

inputs:
  username:
    description: 'GitHub username'
    required: false
    default: ${{ github.repository_owner }}

  github_token:
    description: 'GitHub token'
    required: true

  theme:
    description: 'Card theme (light or dark)'
    required: false
    default: 'light'

  output_dir:
    description: 'Output directory for generated cards'
    required: false
    default: 'profile-summary-card-output'

runs:
  using: 'node20'
  main: 'dist/index.mjs'

branding:
  icon: 'bar-chart-2'
  color: 'blue'
